# Entorno local: base de datos + api + web. Lo usan `make up`, `/perf` (k6) y el DAST opcional.
# - Imágenes de terceros por digest (versión en comentario).
# - Puertos solo en 127.0.0.1. Secretos solo desde .env (ignorado por git).

name: devoto-catolico

services:
  db:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # 16.15
    env_file: .env
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: { context: ./backend }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: { context: ./frontend }
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Solo para /perf: `docker compose --profile perf run --rm k6 run /scripts/<flujo>.js`
  k6:
    image: grafana/k6:1.8.2@sha256:00fdcebafbc86cb0137d429529b1caa401a02e09025f02fc74866fa6e2b004d8 # 1.8.2
    profiles: ["perf"]
    volumes: ["./perf/k6:/scripts:ro"]
    environment:
      BASE_URL: http://api:8000
      PERF_FACTOR: ${PERF_FACTOR:-1}
    depends_on:
      api: { condition: service_healthy }

volumes:
  db-data:
