<!doctype html>
<!--
  REFERENCIA DE DISEÑO · no es código de producción
  Pantalla del lienzo: NovenasAdmin.dc.html
  Ruta en la app: /panel/novenas
  Cómo leer este archivo y cómo implementarlo: docs/design/AGENTS.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel · Novenas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#7A2E3A}a:hover{color:#63232E}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #FAF7F2; color: #2B2622; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 248px; background: #FFFFFF; border-right: 1px solid #E3DACB">
    <dc-import name="PanelNav" current="novenas" role="usuario" hint-size="100%,620px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: clamp(20px, 3vw, 32px) clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 30px">Mis novenas</h1>
        <span style="font-size: 15px; color: #6B6258">Cada novena necesita apertura, 9 días y cierre para solicitar su publicación</span>
      </div>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #7A2E3A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nueva novena
      </button>
    </div>

    <div style="overflow-x: auto; background: #FFFFFF; border: 1px solid #E3DACB; border-radius: 10px">
      <table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 15px">
        <thead>
          <tr style="text-align: left; color: #6B6258; font-size: 13px">
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Novena</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Apertura</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Días</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Cierre</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Estado</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <tr>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC">
                <span style="display: flex; flex-direction: column; gap: 4px">
                  <a href="/panel/novenas/ID" style="color: #2B2622; font-weight: 600; text-decoration: none">{{r.title}}</a>
                  <sc-if value="{{r.hasWarning}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 13px; color: #7A4A05">{{r.warning}}</span>
                  </sc-if>
                </span>
              </td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC; color: {{r.openColor}}; font-weight: 600">{{r.open}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC">
                <span style="display: flex; align-items: center; gap: 10px">
                  <span role="img" aria-label="{{r.daysLabel}}" style="display: block; width: 120px; height: 8px; border-radius: 4px; background: #EFE8DC; overflow: hidden"><span style="{{r.bar}}"></span></span>
                  <span style="font-size: 14px; color: #6B6258">{{r.daysLabel}}</span>
                </span>
              </td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC; color: {{r.closeColor}}; font-weight: 600">{{r.close}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC"><span style="{{r.badge}}"><span aria-hidden="true" style="{{r.dot}}"></span>{{r.status}}</span></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = {
published: { label: 'Publicado', bg: '#E3F0E5', fg: '#24532F', dot: '#2F6B3F' },
in_review: { label: 'En revisión', bg: '#FBEFD9', fg: '#6B4104', dot: '#A8680A' },
draft: { label: 'Privado', bg: '#EFEAE2', fg: '#4A443E', dot: '#6B6258' }
};
const data = [
{ title: 'Novena a San Judas Tadeo', open: true, days: 9, close: true, s: 'in_review', warning: '' },
{ title: 'Novena al Divino Niño Jesús', open: true, days: 6, close: false, s: 'draft', warning: 'Faltan los días 7, 8 y 9 y la oración final. Todavía no se puede solicitar su publicación.' },
{ title: 'Novena de Navidad', open: true, days: 9, close: true, s: 'published', warning: '' },
{ title: 'Novena a la Virgen de Guadalupe', open: true, days: 9, close: true, s: 'published', warning: '' }
];
return {
rows: data.map((d) => {
const t = st[d.s];
const full = d.days === 9;
return {
title: d.title,
warning: d.warning,
hasWarning: d.warning !== '',
open: d.open ? 'Lista' : 'Falta',
openColor: d.open ? '#24532F' : '#7A4A05',
close: d.close ? 'Lista' : 'Falta',
closeColor: d.close ? '#24532F' : '#7A4A05',
daysLabel: d.days + ' de 9',
bar: 'display: block; height: 100%; width: ' + Math.round(d.days / 9 * 100) + '%; background: ' + (full ? '#2F6B3F' : '#A8680A') + ';',
status: t.label,
badge: 'display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 600; background: ' + t.bg + '; color: ' + t.fg + ';',
dot: 'display: block; width: 7px; height: 7px; border-radius: 50%; background: ' + t.dot + ';'
};
})
};
}
}
</script>
</body>
</html>
