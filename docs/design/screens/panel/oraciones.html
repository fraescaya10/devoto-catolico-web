<!doctype html>
<!--
  REFERENCIA DE DISEÑO · no es código de producción
  Pantalla del lienzo: Panel.dc.html
  Ruta en la app: /panel/oraciones
  Cómo leer este archivo y cómo implementarlo: docs/design/AGENTS.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel · Mis oraciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#7A2E3A}a:hover{color:#63232E}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #FAF7F2; color: #2B2622; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 248px; background: #FFFFFF; border-right: 1px solid #E3DACB">
    <dc-import name="PanelNav" current="oraciones" role="usuario" hint-size="100%,620px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: clamp(20px, 3vw, 32px) clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 30px">Mis oraciones</h1>
        <span style="font-size: 15px; color: #6B6258">Oraciones, jaculatorias, cánticos y relatos que creaste</span>
      </div>
      <a href="/panel/oraciones/ID-PRIVADA" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; background: #7A2E3A; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nueva oración
      </a>
    </div>

    <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF; border: 1px solid #E3DACB; border-radius: 10px; font-size: 15px">
      <span role="img" aria-label="2 de 3 solicitudes usadas" style="display: flex; gap: 4px"><span style="display: block; width: 28px; height: 8px; border-radius: 4px; background: #A8680A"></span><span style="display: block; width: 28px; height: 8px; border-radius: 4px; background: #A8680A"></span><span style="display: block; width: 28px; height: 8px; border-radius: 4px; background: #EFE8DC"></span></span>
      <span>Tienes <strong style="font-weight: 600">2 de 3</strong> solicitudes en revisión. Podrás enviar más cuando se resuelvan.</span>
    </div>

    <div role="group" aria-label="Filtrar por estado" style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" aria-pressed="true" style="height: 44px; padding: 0 14px; border: 1px solid #2B2622; border-radius: 22px; background: #2B2622; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Todas · 6</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #D6CBB8; border-radius: 22px; background: #FFFFFF; color: #2B2622; font: inherit; font-size: 14px; cursor: pointer">Privadas · 1</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #D6CBB8; border-radius: 22px; background: #FFFFFF; color: #2B2622; font: inherit; font-size: 14px; cursor: pointer">En revisión · 2</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #D6CBB8; border-radius: 22px; background: #FFFFFF; color: #2B2622; font: inherit; font-size: 14px; cursor: pointer">Publicadas · 2</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border: 1px solid #D6CBB8; border-radius: 22px; background: #FFFFFF; color: #2B2622; font: inherit; font-size: 14px; cursor: pointer">Rechazadas · 1</button>
    </div>

    <div style="overflow-x: auto; background: #FFFFFF; border: 1px solid #E3DACB; border-radius: 10px">
      <table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 15px">
        <thead>
          <tr style="text-align: left; color: #6B6258; font-size: 13px">
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Título</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Tipo</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Estado</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Se comparte en</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #E3DACB">Actualizada</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC">
                <span style="display: flex; flex-direction: column; gap: 4px">
                  <a href="{{r.href}}" style="color: #2B2622; font-weight: 600; text-decoration: none">{{r.title}}</a>
                  <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 13px; color: {{r.noteColor}}">{{r.note}}</span>
                  </sc-if>
                </span>
              </td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC; color: #6B6258">{{r.type}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC"><span style="{{r.badge}}"><span aria-hidden="true" style="{{r.dot}}"></span>{{r.status}}</span></td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC; color: #6B6258">{{r.vis}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid #EFE8DC; color: #6B6258">{{r.updated}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = {
private: { label: 'Privado', bg: '#EFEAE2', fg: '#4A443E', dot: '#6B6258' },
review: { label: 'En revisión', bg: '#FBEFD9', fg: '#6B4104', dot: '#A8680A' },
published: { label: 'Publicado', bg: '#E3F0E5', fg: '#24532F', dot: '#2F6B3F' },
pubreview: { label: 'Publicado · cambios en revisión', bg: '#E3F0E5', fg: '#24532F', dot: '#A8680A' },
rejected: { label: 'Rechazado', bg: '#FCEBEA', fg: '#8C1D16', dot: '#B3261E' },
archived: { label: 'Archivado', bg: '#E6E9EC', fg: '#3E454C', dot: '#59616B' }
};
const data = [
{ title: 'Ángel de mi guarda', type: 'Oración', s: 'private', vis: '—', updated: 'Hoy, 10:42', href: '/panel/oraciones/ID-PRIVADA', note: '' },
{ title: 'Oración a San Miguel Arcángel', type: 'Oración', s: 'pubreview', vis: 'Buscador', updated: 'Ayer', href: '/panel/oraciones/ID-PUBLICADA', note: 'El público sigue viendo la versión 1' },
{ title: 'Jesús, José y María', type: 'Jaculatoria', s: 'review', vis: '—', updated: 'Ayer', href: '/panel/oraciones/ID-PRIVADA', note: '' },
{ title: 'Oración por mi familia', type: 'Oración', s: 'rejected', vis: '—', updated: 'Hace 3 días', href: '/panel/oraciones/ID-PRIVADA', note: 'Motivo: falta la fuente del texto' },
{ title: 'Salve', type: 'Oración', s: 'published', vis: 'Solo enlace', updated: 'Hace 1 semana', href: '/panel/oraciones/ID-PUBLICADA', note: '' },
{ title: 'Bendita sea tu pureza', type: 'Oración', s: 'archived', vis: '—', updated: 'Hace 1 mes', href: '/panel/oraciones/ID-PUBLICADA', note: '' }
];
return {
rows: data.map((d) => {
const t = st[d.s];
return {
title: d.title, type: d.type, vis: d.vis, updated: d.updated, href: d.href, status: t.label,
note: d.note, hasNote: d.note !== '', noteColor: d.s === 'rejected' ? '#8C1D16' : '#6B6258',
badge: 'display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; box-sizing: border-box; border-radius: 13px; font-size: 13px; font-weight: 600; background: ' + t.bg + '; color: ' + t.fg + ';',
dot: 'display: block; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: ' + t.dot + ';'
};
})
};
}
}
</script>
</body>
</html>
