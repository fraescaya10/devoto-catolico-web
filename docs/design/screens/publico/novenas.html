<x-dc>

<div style="min-height: 100vh; box-sizing: border-box; background: #FAF7F2; color: #2B2622; font-family: Inter, system-ui, sans-serif">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: clamp(30px, 4vw, 40px)">Novenas</h1>
      <p style="margin: 0; font-size: 17px; color: #6B6258">Nueve días de oración por una intención. Tu avance se guarda en este dispositivo.</p>
    </div>

    <a href="/novenas/novena-a-san-judas-tadeo" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; background: #F2EDE4; border-radius: 12px; text-decoration: none; color: #2B2622">

        <sc-for list="{{items}}" as="n" hint-placeholder-count="6">

            <span style="font-size: 15px; color: #6B6258">{{n.when}}</span>
            <span style="align-self: flex-start; height: 26px; padding: 0 10px; display: flex; align-items: center; border-radius: 13px; background: #F2EDE4; font-size: 13px; font-weight: 600">9 días</span>
