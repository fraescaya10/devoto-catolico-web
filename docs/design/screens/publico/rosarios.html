<!doctype html>
<!--
  REFERENCIA DE DISEÑO · no es código de producción
  Pantalla del lienzo: Rosarios.dc.html
  Ruta en la app: /rosarios
  Cómo leer este archivo y cómo implementarlo: docs/design/AGENTS.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosarios y coronillas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
a{color:#7A2E3A}a:hover{color:#63232E}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #FAF7F2; color: #2B2622; font-family: Inter, system-ui, sans-serif">
  <dc-import name="PublicHeader" current="rosarios" hint-size="100%,69px"></dc-import>
  <main style="max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 40px) 64px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: clamp(30px, 4vw, 40px)">Rosarios y coronillas</h1>
      <p style="margin: 0; font-size: 17px; color: #6B6258">Reza paso a paso: una oración a la vez, a tu ritmo.</p>
    </div>

    <a href="/rosarios/misterios-gozosos" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: clamp(20px, 3vw, 28px); background: #7A2E3A; border-radius: 12px; text-decoration: none; color: #FFFFFF">
      <span style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #F4DDE1">Hoy · jueves</span>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(22px, 3vw, 28px); font-weight: 600">Santo Rosario · Misterios luminosos</span>
      </span>
      <span style="display: flex; align-items: center; height: 48px; padding: 0 20px; border-radius: 10px; background: #FFFFFF; color: #7A2E3A; font-size: 16px; font-weight: 600">Comenzar</span>
    </a>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px">Santo Rosario</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px">
        <sc-for list="{{misterios}}" as="m" hint-placeholder-count="4">
          <a href="/rosarios/misterios-gozosos" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; background: #FFFFFF; border: 1px solid #E3DACB; border-radius: 12px; text-decoration: none; color: #2B2622">
            <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; font-weight: 600">{{m.title}}</span>
            <span style="font-size: 15px; color: #6B6258">{{m.days}}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px">Coronillas</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px">
        <a href="/rosarios/misterios-gozosos" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; background: #FFFFFF; border: 1px solid #E3DACB; border-radius: 12px; text-decoration: none; color: #2B2622">
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; font-weight: 600">Coronilla de la Divina Misericordia</span>
          <span style="font-size: 15px; color: #6B6258">Se acostumbra a las 3 de la tarde</span>
        </a>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
misterios: [
{ title: 'Misterios gozosos', days: 'Lunes y sábado' },
{ title: 'Misterios dolorosos', days: 'Martes y viernes' },
{ title: 'Misterios gloriosos', days: 'Miércoles y domingo' },
{ title: 'Misterios luminosos', days: 'Jueves' }
]
};
}
}
</script>
</body>
</html>
