<!doctype html>
<!--
  REFERENCIA DE DISEÑO · no es código de producción
  Pantalla del lienzo: Rosario.dc.html
  Ruta en la app: /rosarios/misterios-gozosos
  Cómo leer este archivo y cómo implementarlo: docs/design/AGENTS.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rosario paso a paso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
<style>
body{margin:0}
button:disabled{opacity:.45;cursor:default}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif">
  <dc-import name="PublicHeader" current="rosarios" dark="{{dark}}" hint-size="100%,69px"></dc-import>
  <main style="max-width: 720px; margin: 0 auto; box-sizing: border-box; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 24px) 48px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 600">Santo Rosario</span>
        <span style="font-size: 14px; color: {{c.muted}}">Misterios gozosos · lunes y sábado</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-pressed="{{dark}}" onClick="{{toggleTheme}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid {{c.border}}; border-radius: 10px; background: {{c.surface}}; color: {{c.text}}; font: inherit; font-size: 15px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.text}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          Modo oscuro
        </button>
        <a href="/rosarios" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border: 1px solid {{c.border}}; border-radius: 10px; color: {{c.text}}; text-decoration: none; font-size: 15px">Salir</a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid {{c.border}}; border-bottom: 1px solid {{c.border}}">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: {{c.accent}}">Primer misterio · La Anunciación</span>
      <div role="img" aria-label="{{progressLabel}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <sc-for list="{{beads}}" as="bead" hint-placeholder-count="12">
          <span style="{{bead.style}}"></span>
        </sc-for>
      </div>
      <span aria-live="polite" style="font-size: 14px; color: {{c.muted}}">{{progressLabel}}</span>
    </div>

    <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: clamp(28px, 4vw, 36px); line-height: 1.2">{{step.title}}</h1>
    <p style="margin: 0; min-height: 230px; font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(20px, 2.4vw, 23px); line-height: 1.8">{{step.text}}</p>

    <nav aria-label="Navegación del rosario" style="display: flex; gap: 12px">
      <button type="button" onClick="{{prev}}" disabled="{{atStart}}" style="flex: 1 1 0; height: 56px; border: 1px solid {{c.border}}; border-radius: 10px; background: {{c.surface}}; color: {{c.text}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Anterior</button>
      <button type="button" onClick="{{next}}" disabled="{{atEnd}}" style="flex: 2 1 0; height: 56px; border: 0; border-radius: 10px; background: {{c.primary}}; color: {{c.onPrimary}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Siguiente</button>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 2, dark: null };
}
renderVals() {
const pn = { title: 'Padre Nuestro', text: 'Padre nuestro, que estás en el cielo, santificado sea tu Nombre; venga a nosotros tu reino; hágase tu voluntad en la tierra como en el cielo. Danos hoy nuestro pan de cada día; perdona nuestras ofensas, como también nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentación, y líbranos del mal. Amén.' };
const am = 'Dios te salve, María, llena eres de gracia, el Señor es contigo. Bendita tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús. Santa María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén.';
const gl = { title: 'Gloria', text: 'Gloria al Padre, y al Hijo, y al Espíritu Santo. Como era en el principio, ahora y siempre, por los siglos de los siglos. Amén.' };
const steps = [pn];
for (let n = 1; n <= 10; n++) steps.push({ title: 'Ave María · ' + n + ' de 10', text: am });
steps.push(gl);
const dark = this.state.dark === null ? (this.props.dark ?? true) : this.state.dark;
const light = { bg: '#FAF7F2', surface: '#FFFFFF', text: '#2B2622', muted: '#6B6258', border: '#E3DACB', primary: '#7A2E3A', onPrimary: '#FFFFFF', accent: '#7A5A1E', bead: '#D6CBB8' };
const night = { bg: '#171412', surface: '#211C19', text: '#EDE6DB', muted: '#A89E91', border: '#3A322C', primary: '#D9919B', onPrimary: '#2B1216', accent: '#D2AE66', bead: '#4A4039' };
const c = dark ? night : light;
const i = this.state.i;
const beads = steps.map((s, k) => {
const big = k === 0 || k === steps.length - 1;
const size = big ? 16 : 12;
const fill = k < i ? c.primary : (k === i ? c.accent : c.bead);
const ring = k === i ? ' box-shadow: 0 0 0 3px ' + c.bg + ', 0 0 0 5px ' + c.accent + ';' : '';
return { style: 'display: block; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: ' + fill + ';' + ring };
});
return {
c: c,
dark: dark,
step: steps[i],
beads: beads,
progressLabel: 'Paso ' + (i + 1) + ' de ' + steps.length,
atStart: i === 0,
atEnd: i === steps.length - 1,
prev: () => this.setState({ i: Math.max(0, i - 1) }),
next: () => this.setState({ i: Math.min(steps.length - 1, i + 1) }),
toggleTheme: () => this.setState({ dark: !dark })
};
}
}
</script>
</body>
</html>
